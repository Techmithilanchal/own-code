<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Outer glowing glow effect -->
  <circle cx="16" cy="16" r="14" fill="url(#glow-grad)" opacity="0.15"/>
  <!-- Curved network link paths -->
  <path d="M8 16C8 11.5817 11.5817 8 16 8" stroke="url(#line-grad-1)" stroke-width="2" stroke-linecap="round"/>
  <path d="M24 16C24 20.4183 20.4183 24 16 24" stroke="url(#line-grad-2)" stroke-width="2" stroke-linecap="round"/>
  <!-- Central node representing core intelligence -->
  <circle cx="16" cy="16" r="5" fill="url(#core-grad)" filter="url(#drop-shadow)"/>
  <!-- Small surrounding orbital nodes -->
  <circle cx="8" cy="16" r="2.5" fill="#06b6d4" />
  <circle cx="24" cy="16" r="2.5" fill="#8b5cf6" />
  <circle cx="16" cy="8" r="2" fill="#8b5cf6" opacity="0.7"/>
  <circle cx="16" cy="24" r="2" fill="#06b6d4" opacity="0.7"/>
  
  <defs>
    <!-- Gradients -->
    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="line-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="line-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#8b5cf6" flood-opacity="0.5"/>
    </filter>
  </defs>
</svg>
